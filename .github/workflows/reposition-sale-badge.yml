name: Reposition sale badge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sale-badge-repositioned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reposition targeted sale badge
        shell: bash
        run: |
          cat >> brand-refresh.css <<'CSS'

          /* Final SALE badge placement: sit on the outer top-left card corner,
             keep the same shake/tilt, and scale the badge down by 15%. */
          #tabCards .card:first-child{
            position:relative!important;
          }
          #tabCards .card:first-child::after{
            top:2px!important;
            left:2px!important;
            width:66px!important;
            height:46px!important;
          }
          @media(max-width:680px){
            #tabCards .card:first-child::after{
              top:2px!important;
              left:2px!important;
              width:46px!important;
              height:32px!important;
            }
          }
          CSS

          rm -f .github/workflows/reposition-sale-badge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-refresh.css .github/workflows/reposition-sale-badge.yml
          git commit -m "fix: move SALE sticker to card corner and reduce size [sale-badge-repositioned]"
          git push origin HEAD:main

      - name: Validate
        run: |
          git diff HEAD^ --check
          grep -q "Final SALE badge placement" brand-refresh.css
