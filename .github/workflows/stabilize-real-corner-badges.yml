name: Stabilize real product corner badges

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stable-real-badges]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace badge renderer with non-recursive implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          pattern=r'<script>\n/\* Real IMG product corner badges — deterministic renderer\. \*/.*?</script>'
          replacement='''<script>\n/* Real IMG product corner badges — deterministic renderer. */\n(()=>{\n  const badgeMap={\n    'Durex Intense - 3 Condoms':['corner-badge--best-deal','assets/badge-best-deal-ever.svg','Best Deal Ever'],\n    'Durex Naturals Smooth Glide - 3 Condoms':['corner-badge--limited','assets/badge-limited-time.svg','Limited Time'],\n    'Durex Intense Vibe Ring':['corner-badge--popular','assets/badge-popular-choice.svg','Popular Choice']\n  };\n  const paintCard=card=>{\n    const name=card.querySelector('h3')?.textContent?.trim();\n    const spec=badgeMap[name];\n    const existing=card.querySelector(':scope > .product-corner-sticker');\n    card.classList.remove('corner-badge','corner-badge--best-deal','corner-badge--limited','corner-badge--popular');\n    if(!spec){existing?.remove();return;}\n    card.classList.add('corner-badge',spec[0]);\n    if(existing){\n      if(!existing.src.endsWith(spec[1].split('/').pop()))existing.src=spec[1];\n      existing.alt=spec[2];\n      return;\n    }\n    const badge=document.createElement('img');\n    badge.className='product-corner-sticker';\n    badge.src=spec[1];\n    badge.alt=spec[2];\n    badge.setAttribute('aria-hidden','true');\n    badge.decoding='sync';\n    card.prepend(badge);\n  };\n  const paintAll=root=>(root||document).querySelectorAll('.card').forEach(paintCard);\n  const start=()=>{\n    paintAll(document);\n    const tabHost=document.querySelector('#tabCards');\n    if(tabHost)new MutationObserver(()=>requestAnimationFrame(()=>paintAll(tabHost))).observe(tabHost,{childList:true});\n    document.querySelector('.sale-tabs')?.addEventListener('click',()=>requestAnimationFrame(()=>paintAll(document)));\n  };\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();\n})();\n</script>'''
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected exactly 1 real-badge renderer block, found {n}')
          p.write_text(s2)
          PY

          rm -f .github/workflows/stabilize-real-corner-badges.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/stabilize-real-corner-badges.yml
          git commit -m "fix: stabilize real corner badge renderer [stable-real-badges]"
          git push origin HEAD:main

      - name: Verify
        shell: bash
        run: |
          git diff HEAD^ --check
          grep -q "paintCard=card" index.html
          grep -q "observe(tabHost,{childList:true})" index.html
          ! grep -q "observe(document.body,{childList:true,subtree:true})" index.html
