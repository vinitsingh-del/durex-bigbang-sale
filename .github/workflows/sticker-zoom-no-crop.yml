name: Sticker zoom pulse and no crop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sticker-zoom-pulse]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sticker-only animation and overflow fix
        shell: bash
        run: |
          cat >> brand-refresh.css <<'CSS'

          /* ============================================================
             STICKER-ONLY FINAL MOTION PASS
             - No shake/rotation animation.
             - Faster, prominent zoom in/out pulse.
             - Keep all stickers fully visible on desktop and mobile.
             - No product-card geometry, typography or other UI changes.
             ============================================================ */
          @keyframes sticker-zoom-pulse{
            0%,100%{transform:rotate(-6deg) scale(.88)}
            50%{transform:rotate(-6deg) scale(1.18)}
          }

          /* Original SALE sticker. */
          #tabCards .card:first-child{
            overflow:visible!important;
          }
          #tabCards .card:first-child::after{
            animation:sticker-zoom-pulse .72s cubic-bezier(.22,.75,.25,1) infinite!important;
            transform-origin:50% 55%!important;
          }

          /* Added product stickers rendered as real IMG nodes. */
          .card.corner-badge{
            overflow:visible!important;
          }
          .product-corner-sticker{
            animation:sticker-zoom-pulse .72s cubic-bezier(.22,.75,.25,1) infinite!important;
            transform-origin:50% 55%!important;
          }
          .card:hover .product-corner-sticker{
            animation:sticker-zoom-pulse .72s cubic-bezier(.22,.75,.25,1) infinite!important;
          }

          /* Preserve horizontal rails while allowing vertical sticker overflow. */
          #tabCards,.sale-catalog .cards,.cards,.rail{
            overflow-y:visible!important;
          }

          @media(max-width:680px){
            #tabCards,.sale-catalog .cards,.rail{
              overflow-x:auto!important;
              overflow-y:visible!important;
            }
            #tabCards .card:first-child,
            .card.corner-badge{
              overflow:visible!important;
            }
          }

          @media(prefers-reduced-motion:reduce){
            #tabCards .card:first-child::after,
            .product-corner-sticker{
              animation:none!important;
              transform:rotate(-6deg) scale(1)!important;
            }
          }
          CSS

          rm -f .github/workflows/sticker-zoom-no-crop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-refresh.css .github/workflows/sticker-zoom-no-crop.yml
          git commit -m "fix: sticker zoom pulse with no cropping [sticker-zoom-pulse]"
          git push origin HEAD:main

      - name: Verify sticker-only change
        shell: bash
        run: |
          git diff HEAD^ --check
          grep -q "STICKER-ONLY FINAL MOTION PASS" brand-refresh.css
          grep -q "sticker-zoom-pulse .72s" brand-refresh.css
          grep -q "overflow-y:visible" brand-refresh.css
