name: Apply approved hero asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[approved-hero-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact approved hero and swap only hero backgrounds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          parts = [Path(f'.hero-upload/final{i:02}.txt').read_text().strip() for i in range(1, 8)]
          data = base64.b64decode(''.join(parts))
          expected = '8bbdd31780a1a83822e8b00ccb9e478ee4e79ee68fc44e0fccd0e8419e935290'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'Hero asset checksum mismatch: {actual}')

          Path('assets/hero-approved-neon-69.webp').write_bytes(data)

          p = Path('index.html')
          s = p.read_text()
          old_refs = [
              'assets/hero-retro-69-1.webp',
              'assets/hero-retro-69-2.webp',
              'assets/hero-retro-69-3.webp',
          ]
          for old in old_refs:
              if old not in s:
                  raise SystemExit(f'Missing expected hero reference: {old}')
              s = s.replace(old, 'assets/hero-approved-neon-69.webp', 1)

          if 'assets/hero-69-big-bang-sale-brand.png' not in s:
              raise SystemExit('Centered 69 logo reference missing; refusing change.')
          p.write_text(s)
          PY

          rm -rf .hero-upload
          rm -f .github/workflows/apply-approved-hero.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: use approved hero image only [approved-hero-applied]"
          git push origin HEAD:main

      - name: Verify final tree
        shell: bash
        run: |
          test -f assets/hero-approved-neon-69.webp
          test ! -d .hero-upload
          test ! -f .github/workflows/apply-approved-hero.yml
          test "$(grep -o "assets/hero-approved-neon-69.webp" index.html | wc -l)" -eq 3
          grep -q "assets/hero-69-big-bang-sale-brand.png" index.html
