name: Fix mobile card clipping

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-card-clipping-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix mobile product text and video framing
        shell: bash
        run: |
          cat >> brand-refresh.css <<'CSS'

          /* ============================================================
             Mobile-only product-card clipping fix — Aug 21 2026
             Keep the existing 3:4 card ratio and orientation. Rebalance only
             the internal split so title, price and CTA remain fully visible.
             Bestseller videos always show the full frame without side crop.
             ============================================================ */
          @media(max-width:680px){
            .card,
            .sale-catalog .card,
            .cards:not(.sale-catalog .cards) .card,
            .rail .card,
            [data-cards]:not(.sale-catalog .cards) .card{
              aspect-ratio:3/4!important;
              grid-template-rows:minmax(0,56%) minmax(0,44%)!important;
              overflow:hidden!important;
            }

            .card .media,
            .rail .card .media,
            .sale-catalog .card .media{
              width:100%!important;
              height:100%!important;
              min-height:0!important;
              overflow:hidden!important;
              background:#fff!important;
            }

            .card .media img,
            .rail .card .media img,
            .sale-catalog .card .media img{
              width:100%!important;
              height:100%!important;
              object-fit:contain!important;
              object-position:center center!important;
              padding:3px!important;
              transform:none!important;
            }

            /* Video cards — especially Bestsellers — always expose the complete portrait frame. */
            #wanted .card .media video,
            .card .media video,
            .rail .card .media video{
              display:block!important;
              width:100%!important;
              height:100%!important;
              max-width:100%!important;
              object-fit:contain!important;
              object-position:center center!important;
              transform:none!important;
              margin:0 auto!important;
              background:#fff!important;
            }

            /* Give typography enough vertical room; no clipped title/price rows. */
            .card .info,
            .rail .card .info,
            .sale-catalog .card .info,
            .cards:not(.sale-catalog .cards) .card .info{
              display:flex!important;
              flex-direction:column!important;
              justify-content:flex-start!important;
              height:100%!important;
              min-height:0!important;
              overflow:hidden!important;
              padding:7px 9px 8px!important;
            }
            .card .info p,
            .rail .card .info p,
            .sale-catalog .card .info p{
              margin:0 0 3px!important;
              min-height:0!important;
              font-size:6.25px!important;
              line-height:1.08!important;
            }
            .card .info h3,
            .rail .card .info h3,
            .sale-catalog .card .info h3{
              display:-webkit-box!important;
              min-height:0!important;
              margin:0 0 4px!important;
              overflow:hidden!important;
              font-size:10px!important;
              line-height:1.06!important;
              letter-spacing:-.02em!important;
              -webkit-box-orient:vertical!important;
              -webkit-line-clamp:2!important;
            }

            .card .bottom,
            .rail .card .bottom,
            .sale-catalog .card .bottom{
              display:flex!important;
              flex-direction:column!important;
              align-items:stretch!important;
              gap:4px!important;
              margin-top:auto!important;
              min-height:0!important;
            }
            .bottom .price-row{
              display:flex!important;
              align-items:center!important;
              gap:4px!important;
              flex-wrap:wrap!important;
              min-height:0!important;
            }
            .bottom .price-row b{font-size:12px!important;line-height:1!important}
            .bottom .price-sub{gap:4px!important;margin-top:0!important;line-height:1!important}
            .card .bottom .price-sub s,
            .rail .card .bottom .price-sub s,
            .sale-catalog .card .bottom .price-sub s{font-size:7.5px!important;line-height:1!important}
            .bottom .price-sub em.disc{font-size:6.5px!important;line-height:1!important;padding:2px 4px!important}

            /* Compact CTA only; same placement and orientation. */
            .add,.card .add,.bottom .add,.sale-catalog .card .add{
              width:100%!important;
              min-height:30px!important;
              height:30px!important;
              padding:6px 31px 6px 10px!important;
              border-radius:999px!important;
              font-size:7.75px!important;
              line-height:1!important;
            }
            .add-cart,.sale-catalog .card .add-cart{
              width:24px!important;
              height:24px!important;
              right:-2px!important;
            }
            .add-cart svg,.sale-catalog .card .add-cart svg{width:11px!important;height:11px!important}
          }
          CSS

          rm -f .github/workflows/fix-mobile-card-clipping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-refresh.css .github/workflows/fix-mobile-card-clipping.yml
          git commit -m "fix: mobile card text clipping and video framing [mobile-card-clipping-fixed]"
          git push origin HEAD:main

      - name: Validate
        run: |
          git diff HEAD^ --check
          grep -q "Mobile-only product-card clipping fix" brand-refresh.css
