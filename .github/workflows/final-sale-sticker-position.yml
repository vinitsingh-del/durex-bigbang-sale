name: Final verified SALE sticker position

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sale-sticker-final-position]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified position only
        shell: bash
        run: |
          cat >> brand-refresh.css <<'CSS'

          /* ============================================================
             FINAL VERIFIED SALE STICKER POSITION
             Reference: red mark at the outer top-left corner of the first
             Extra Time 3-pack card. Position only. No other UI changes.
             ============================================================ */
          #tabCards .card:first-child{
            position:relative!important;
            overflow:visible!important;
            isolation:isolate!important;
          }
          #tabCards .card:first-child::after{
            top:-10px!important;
            left:-8px!important;
            z-index:50!important;
          }
          #tabCards{overflow:visible!important}

          @media(max-width:680px){
            #tabCards{
              overflow-x:auto!important;
              overflow-y:visible!important;
              padding-left:12px!important;
              margin-left:-12px!important;
              width:calc(100% + 12px)!important;
            }
            #tabCards .card:first-child{
              overflow:visible!important;
            }
            #tabCards .card:first-child::after{
              top:-8px!important;
              left:-6px!important;
              z-index:50!important;
            }
          }
          CSS

          rm -f .github/workflows/final-sale-sticker-position.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-refresh.css .github/workflows/final-sale-sticker-position.yml
          git commit -m "fix: final verified SALE sticker position [sale-sticker-final-position]"
          git push origin HEAD:main

      - name: Verify CSS
        shell: bash
        run: |
          git diff HEAD^ --check
          grep -q "FINAL VERIFIED SALE STICKER POSITION" brand-refresh.css
          grep -q "left:-8px!important" brand-refresh.css
          grep -q "top:-10px!important" brand-refresh.css
