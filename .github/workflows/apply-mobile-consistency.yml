name: Apply mobile consistency pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-consistency-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append mobile-only consistency layer
        shell: bash
        run: |
          cat >> brand-refresh.css <<'CSS'

          /* ============================================================
             Mobile consistency pass — Aug 21 2026
             Mobile-only normalization matching the approved desktop cadence.
             No content, imagery, colour, font family, section order, card
             orientation, desktop geometry or video behaviour is changed.
             ============================================================ */
          @media(max-width:680px){
            html,body{width:100%;max-width:100%;overflow-x:hidden}
            body{-webkit-text-size-adjust:100%;text-size-adjust:100%}

            /* One shared page gutter and vertical rhythm. */
            .shell,.wide{width:calc(100% - 24px)!important;margin-left:auto!important;margin-right:auto!important}
            .sale-catalog,.launch,.section{padding-top:30px!important}
            .sale-catalog{padding-bottom:0!important}
            .heading{display:flex!important;align-items:flex-end!important;justify-content:space-between!important;gap:12px!important;margin-bottom:14px!important}
            .heading>div{min-width:0!important}
            .heading>div>p,.kicker{margin-bottom:5px!important;font-size:9px!important;line-height:1.15!important;letter-spacing:1.15px!important}
            main section h2,
            main section h2.title,
            main section.sale-catalog .sale-intro h2.title,
            .heading h2,
            .dark-showcase h2{font-size:28px!important;font-weight:800!important;line-height:.94!important;letter-spacing:-.035em!important}
            .heading a{flex:0 0 auto!important;min-width:44px!important;min-height:44px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;padding:8px 0 5px!important;font-size:10.5px!important}

            /* Header, hero and first-fold spacing remain compact but balanced. */
            header{height:52px!important;min-height:52px!important;max-height:52px!important;padding:8px 16px 0!important;align-items:flex-start!important}
            .brand img{width:92px!important}
            .hamb{top:9px!important;left:15px!important;width:44px!important;height:44px!important;margin:0!important;padding:7px!important}
            .hamb i{margin:4px auto!important}
            .announcement__track{padding:7px 14px!important;gap:22px!important;font-size:8px!important;line-height:1!important}
            .hero{margin-bottom:12px!important;border-radius:16px!important}
            .sale-intro{align-items:center!important;justify-content:center!important;gap:3px!important;margin:0 0 10px!important;text-align:center!important}
            .sale-catalog .title{font-size:28px!important;line-height:.94!important;letter-spacing:-.035em!important}
            .sale-catalog .kicker{font-size:11px!important;line-height:1!important}

            /* Consistent, finger-safe filter controls. */
            .sale-catalog .sale-tabs{gap:8px!important;padding:0 0 12px!important;scroll-padding-inline:2px!important}
            .sale-catalog .sale-tabs button{min-height:44px!important;padding:10px 14px!important;font-size:10px!important;line-height:1!important}

            /* Category discovery follows the same 12px outer gutter and even card spacing. */
            .quick-links{margin:18px 0 20px!important}
            .quick-links-head{gap:10px!important;margin-bottom:11px!important}
            .quick-links-head h3{font-size:14px!important;line-height:1.05!important}
            .quick-links-track{gap:10px!important}
            .quick-links-track a{flex-basis:92px!important;min-height:76px!important;padding:8px 6px!important;border-radius:10px!important;text-align:center!important}
            .quick-links-track a img{width:44px!important;height:44px!important;padding:5px!important}
            .quick-links-track a span{font-size:7px!important;line-height:1.1!important;white-space:normal!important;text-overflow:clip!important;overflow:visible!important}

            /* One mobile card system: equal gutters, equal internal padding and stable baselines. */
            .cards{gap:10px!important}
            .rail{gap:10px!important;padding:2px 0 10px!important;scroll-padding-inline:0!important}
            .cards:not(.sale-catalog .cards){grid-template-columns:repeat(2,minmax(0,1fr))!important}
            .cards:not(.sale-catalog .cards) .card{width:100%!important;min-width:0!important;max-width:none!important}
            .rail .card{flex:0 0 46vw!important;width:46vw!important;max-width:180px!important;min-width:0!important}
            .sale-catalog .cards{gap:10px!important;padding:2px 0 10px!important}
            .sale-catalog .card{flex:0 0 46vw!important;width:46vw!important;max-width:180px!important;min-width:0!important;height:auto!important;min-height:0!important}

            .card,.sale-catalog .card{border-radius:14px!important}
            .card .media,.rail .card .media,.sale-catalog .card .media{width:100%!important;aspect-ratio:1/1!important;height:auto!important;min-height:0!important;overflow:hidden!important;border-radius:13px 13px 0 0!important}
            .card .media img,.rail .card .media img,.sale-catalog .card .media img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;padding:6px!important;transform:none!important}
            .card .info,.rail .card .info,.sale-catalog .card .info{display:flex!important;flex-direction:column!important;height:auto!important;min-height:138px!important;overflow:visible!important;padding:10px!important}
            .card .info p,.rail .card .info p,.sale-catalog .card .info p{min-height:0!important;margin:0 0 5px!important;font-size:7px!important;line-height:1.15!important;letter-spacing:.05em!important}
            .card .info h3,.rail .card .info h3,.sale-catalog .card .info h3{min-height:28px!important;margin:0 0 7px!important;font-size:12px!important;line-height:1.08!important;letter-spacing:-.025em!important;-webkit-line-clamp:2!important}
            .card .bottom,.rail .card .bottom,.sale-catalog .card .bottom{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important;margin-top:auto!important;min-height:0!important}
            .bottom .price-row{display:flex!important;align-items:baseline!important;gap:6px!important;flex-wrap:wrap!important}
            .bottom .price-row b{font-size:14px!important;line-height:1!important}
            .bottom .price-sub{display:flex!important;align-items:center!important;gap:5px!important;margin-top:0!important}
            .card .bottom .price-sub s,.sale-catalog .card .bottom .price-sub s,.rail .card .bottom .price-sub s{font-size:9px!important;line-height:1!important}
            .bottom .price-sub em.disc{font-size:7.5px!important;line-height:1.25!important;padding:2px 5px!important}

            /* CTAs align to one full-width baseline and meet mobile touch sizing. */
            .add,.card .add,.bottom .add,.sale-catalog .card .add{width:100%!important;min-height:44px!important;height:44px!important;padding:8px 38px 8px 12px!important;border-radius:999px!important;font-size:9px!important;line-height:1!important}
            .add-cart,.sale-catalog .card .add-cart{right:-4px!important;width:30px!important;height:30px!important}
            .add-cart svg,.sale-catalog .card .add-cart svg{width:14px!important;height:14px!important}

            /* Bundle, compare, proof and reels use the same section cadence. */
            .bundle2{padding:16px!important;border-radius:16px!important}
            .bundle2-top{gap:12px!important;margin-bottom:14px!important}
            .bundle2-row{gap:10px!important;padding-bottom:8px!important}
            .bundle2-card{flex-basis:132px!important;border-radius:12px!important}
            .bundle2-media{height:118px!important}
            .bundle2-info{padding:9px 10px 11px!important}
            .bundle2-summary{margin-top:14px!important;padding-top:14px!important}
            .bundle2-summary .yellow{min-height:44px!important}
            .compare{gap:12px!important}
            .compare article{padding:12px!important;border-radius:14px!important}
            .compare .compare-pic{height:210px!important;border-radius:10px!important}
            .compare h3{margin:11px 0 5px!important;font-size:19px!important;line-height:1!important}
            .compare p{font-size:12px!important;line-height:1.4!important}
            .compare button{min-height:44px!important;margin-top:12px!important}
            .trust-track article{padding:20px!important}
            .trust h3{margin:22px 0 8px!important;font-size:21px!important;line-height:1!important}
            .trust p{font-size:12px!important;line-height:1.45!important}
            .reel-rail{gap:10px!important;padding:18px 4vw 10px!important}
            .reel-card{flex-basis:132px!important;border-radius:14px!important}
            .reel-arrow{width:44px!important;height:44px!important}

            /* Bottom controls and safe areas never cover the last row. */
            .mobile-mega{left:8px!important;right:8px!important;bottom:max(8px,env(safe-area-inset-bottom))!important;border-radius:14px!important}
            .mobile-mega-bar{gap:6px!important;padding:6px!important}
            .mobile-mega button{min-height:44px!important;font-size:8px!important}
            .mobile-mega-panel{gap:6px!important;padding:0 6px 6px!important}
            .mobile-mega-panel a{min-height:44px!important;font-size:8px!important}
            .mood-now{right:12px!important;bottom:calc(76px + env(safe-area-inset-bottom))!important}
            footer{width:calc(100% - 24px)!important;margin-top:38px!important;padding-bottom:calc(112px + env(safe-area-inset-bottom))!important}

            /* Prevent accidental clipping from long labels while preserving existing copy. */
            .title,.heading h2,.dark-showcase h2,.card h3,.compare h3,.bundle2-info p{overflow-wrap:anywhere}
          }
          CSS

          rm -f .github/workflows/apply-mobile-consistency.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-refresh.css .github/workflows/apply-mobile-consistency.yml
          git commit -m "fix: mobile consistency and spacing [mobile-consistency-applied]"
          git push origin HEAD:main

      - name: Static QA
        shell: bash
        run: |
          git diff HEAD^ --check
          grep -q "Mobile consistency pass — Aug 21 2026" brand-refresh.css
          grep -q "@media(max-width:680px)" brand-refresh.css
