name: Fix visible corner badges

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[corner-badges-visible]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add explicit badge classes and stable CSS
        shell: bash
        run: |
          cat >> brand-refresh.css <<'CSS'

          /* ============================================================
             Reliable explicit corner badges — class based, no :has().
             Uses the same locked outer top-left treatment as the approved
             SALE sticker and survives dynamic tab re-rendering.
             ============================================================ */
          .card.corner-badge{
            position:relative!important;
            overflow:visible!important;
            isolation:isolate!important;
          }
          .card.corner-badge::before{
            content:""!important;
            display:block!important;
            position:absolute!important;
            z-index:60!important;
            top:-12px!important;
            left:-6px!important;
            width:66px!important;
            height:46px!important;
            background-position:center!important;
            background-repeat:no-repeat!important;
            background-size:contain!important;
            pointer-events:none!important;
            transform-origin:50% 55%!important;
            animation:sale-sticker-shake 1.15s ease-in-out infinite!important;
            filter:drop-shadow(0 4px 5px rgba(0,0,0,.24))!important;
          }
          .card.corner-badge--best-deal::before{background-image:url('assets/badge-best-deal-ever.svg')!important}
          .card.corner-badge--limited::before{background-image:url('assets/badge-limited-time.svg')!important}
          .card.corner-badge--popular::before{background-image:url('assets/badge-popular-choice.svg')!important}
          #tabCards,.cards,.rail{overflow-y:visible!important}

          @media(max-width:680px){
            .card.corner-badge::before{
              top:-10px!important;
              left:-5px!important;
              width:46px!important;
              height:32px!important;
            }
          }
          @media(prefers-reduced-motion:reduce){.card.corner-badge::before{animation:none!important}}
          CSS

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* Explicit product corner badges: stable across dynamic card renders. */'
          if marker not in s:
              script='''<script>\n/* Explicit product corner badges: stable across dynamic card renders. */\n(()=>{\n  const badgeMap={\n    'Durex Intense - 3 Condoms':'corner-badge--best-deal',\n    'Durex Naturals Smooth Glide - 3 Condoms':'corner-badge--limited',\n    'Durex Intense Vibe Ring':'corner-badge--popular'\n  };\n  const applyBadges=root=>{\n    (root||document).querySelectorAll('.card').forEach(card=>{\n      const name=card.querySelector('h3')?.textContent?.trim();\n      const badgeClass=badgeMap[name];\n      card.classList.remove('corner-badge','corner-badge--best-deal','corner-badge--limited','corner-badge--popular');\n      if(badgeClass)card.classList.add('corner-badge',badgeClass);\n    });\n  };\n  applyBadges(document);\n  const tabHost=document.querySelector('#tabCards');\n  if(tabHost)new MutationObserver(()=>applyBadges(tabHost)).observe(tabHost,{childList:true,subtree:true});\n  document.querySelector('.sale-tabs')?.addEventListener('click',()=>requestAnimationFrame(()=>applyBadges(document)));\n})();\n</script>'''
              s=s.replace('</body>',script+'\n</body>')
              p.write_text(s)
          PY

          rm -f .github/workflows/fix-visible-corner-badges.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html brand-refresh.css .github/workflows/fix-visible-corner-badges.yml
          git commit -m "fix: render three product corner badges reliably [corner-badges-visible]"
          git push origin HEAD:main

      - name: Verify
        shell: bash
        run: |
          git diff HEAD^ --check
          grep -q "Explicit product corner badges: stable across dynamic card renders" index.html
          grep -q "Reliable explicit corner badges" brand-refresh.css
          test -f assets/badge-best-deal-ever.svg
          test -f assets/badge-limited-time.svg
          test -f assets/badge-popular-choice.svg
